spring.application.name=flash



server.port=8085

# Cloud-Ready Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/your_local_db_name_here}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_local_mysql_password_here}

# Hibernate properties for automatic table generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.address=0.0.0.0

